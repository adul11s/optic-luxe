name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optic_luxe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optic_luxe_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optic_luxe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install (server)
        run: npm ci
        working-directory: server
      - name: Prisma generate
        run: npx prisma generate
        working-directory: server
      - name: Push schema to test DB
        run: npx prisma db push --skip-generate
        working-directory: server
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: server
      - name: Tests (vitest run)
        run: npm test
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install (client)
        run: npm ci
        working-directory: client
      - name: Typecheck (tsc --noEmit)
        run: npx --yes tsc --noEmit
        working-directory: client
